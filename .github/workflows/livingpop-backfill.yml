name: livingpop-backfill

# 서울 생활인구 과거 월별 집계 아카이브를 만든다.
# 서울시 파일 서버는 클라우드 샌드박스에서 접속이 막혀 있어 이 러너에서만 돌 수 있다.
#
# inspect=true 로 먼저 한 달을 돌려 원자료의 헤더·구분자·인코딩을 로그로 확인한 뒤
# 전체 구간을 적재하는 것을 권장한다(에러 없이 0건이 나오는 사고를 막는 단계다).

# 트리거는 둘이다.
#   ① 화면에서 Run workflow (workflow_dispatch)
#   ② data/livingpop/BACKFILL_REQUEST 파일을 커밋 — 클라우드 세션은 GitHub API 로
#      workflow_dispatch 를 부를 수 없어(세션 프록시가 막는다) push 로 걸 수 있는 문이 필요하다.
#      파일 형식: 첫 줄에 "from=YYYYMM to=YYYYMM [inspect]" 한 줄.

on:
  push:
    paths:
      - "data/livingpop/BACKFILL_REQUEST"
  workflow_dispatch:
    inputs:
      from:
        description: "시작 월 YYYYMM (원본 최초 제공월은 202301)"
        required: true
        default: "202301"
      to:
        description: "종료 월 YYYYMM"
        required: true
        default: "202607"
      inspect:
        description: "true 면 적재하지 않고 파일 구조만 로그에 찍는다"
        required: false
        default: "false"
      rebuild_dong_meta:
        description: "true 면 행정동코드-이름 매핑도 다시 만든다"
        required: false
        default: "true"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 요청 파싱 (수동 실행 인자 또는 BACKFILL_REQUEST 파일)
        id: req
        run: |
          FROM="${{ github.event.inputs.from }}"
          TO="${{ github.event.inputs.to }}"
          INSPECT="${{ github.event.inputs.inspect }}"
          META="${{ github.event.inputs.rebuild_dong_meta }}"
          if [ -z "$FROM" ] && [ -f data/livingpop/BACKFILL_REQUEST ]; then
            LINE=$(head -1 data/livingpop/BACKFILL_REQUEST)
            FROM=$(echo "$LINE" | grep -o 'from=[0-9]\{6\}' | cut -d= -f2)
            TO=$(echo "$LINE"   | grep -o 'to=[0-9]\{6\}'   | cut -d= -f2)
            case "$LINE" in *inspect*) INSPECT=true;; *) INSPECT=false;; esac
            META=false
          fi
          : "${INSPECT:=false}"
          : "${META:=false}"
          echo "from=$FROM"       >> $GITHUB_OUTPUT
          echo "to=$TO"           >> $GITHUB_OUTPUT
          echo "inspect=$INSPECT" >> $GITHUB_OUTPUT
          echo "meta=$META"       >> $GITHUB_OUTPUT
          echo "구간 $FROM ~ $TO / inspect=$INSPECT / meta=$META"
          if [ -z "$FROM" ] || [ -z "$TO" ]; then
            echo "::error::from/to 를 정할 수 없습니다"; exit 1
          fi

      - name: 행정동 매핑 생성
        if: ${{ steps.req.outputs.meta == 'true' && steps.req.outputs.inspect != 'true' }}
        env:
          SEOUL_OPENAPI_KEY: ${{ secrets.SEOUL_OPENAPI_KEY }}
        run: node scripts/build_dong_meta.mjs

      # ★ 실행 로그를 저장소에도 남긴다.
      #   Actions 로그는 GitHub 로그인 없이는 읽을 수 없어, 로그인 세션이 없는 환경에서
      #   실패 원인을 확인할 방법이 사라진다. 리포트를 커밋해 두면 git pull 로 읽을 수 있다.
      - name: 실행 (로그를 리포트 파일에도 기록)
        id: run
        continue-on-error: true
        run: |
          mkdir -p data/livingpop
          REPORT=data/livingpop/LAST_RUN.txt
          {
            echo "실행시각(UTC): $(date -u +%FT%TZ)"
            echo "요청: from=${{ steps.req.outputs.from }} to=${{ steps.req.outputs.to }} inspect=${{ steps.req.outputs.inspect }}"
            echo "커밋: $GITHUB_SHA"
            echo "----"
          } > $REPORT
          set +e
          if [ "${{ steps.req.outputs.inspect }}" = "true" ]; then
            node scripts/build_livingpop_archive.mjs --months ${{ steps.req.outputs.from }} --inspect 2>&1 | tee -a $REPORT
          else
            node scripts/build_livingpop_archive.mjs --from ${{ steps.req.outputs.from }} --to ${{ steps.req.outputs.to }} 2>&1 | tee -a $REPORT
          fi
          CODE=${PIPESTATUS[0]}
          set -e
          {
            echo "----"
            echo "종료코드: $CODE"
            echo "아카이브 파일:"
            ls -la data/livingpop | tail -n +2 | awk '{print "  " $9, $5}'
            echo "총 용량: $(du -sh data/livingpop | cut -f1)"
          } >> $REPORT
          cat $REPORT >> $GITHUB_STEP_SUMMARY
          echo "code=$CODE" >> $GITHUB_OUTPUT

      - name: 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/livingpop
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "생활인구 아카이브 ${{ steps.req.outputs.from }}~${{ steps.req.outputs.to }} (종료코드 ${{ steps.run.outputs.code }})"
            git pull --rebase --autostash
            git push
          fi

      - name: 종료코드 반영
        if: ${{ steps.run.outputs.code != '0' }}
        run: |
          echo "::error::적재 스크립트가 종료코드 ${{ steps.run.outputs.code }} 로 끝났습니다. data/livingpop/LAST_RUN.txt 를 확인하세요."
          exit 1
