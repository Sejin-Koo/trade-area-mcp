name: livingpop-monthly

# 매달 새로 공개되는 생활인구 월별 파일을 아카이브에 덧붙인다.
# 서울시는 대략 한 달 반쯤 뒤에 그 달 파일을 올리므로, 최근 3개월을 훑어
# 아직 없는 달만 채우는 방식으로 둔다(공개 지연에 강하다).
#
# 보존기간은 두지 않는다 — 2023-01 전량을 유지한다.
# 한 달치가 gzip 약 0.7MB라 연 10MB 미만이고, 과거 비교가 이 데이터의 존재 이유다.

on:
  schedule:
    - cron: "0 20 8 * *" # 매월 9일 05:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 빠진 달 계산
        id: plan
        run: |
          node -e '
            const fs=require("fs");
            const dir="data/livingpop";
            const have=new Set(fs.existsSync(dir)?fs.readdirSync(dir).filter(f=>/^\d{6}\.csv\.gz$/.test(f)).map(f=>f.slice(0,6)):[]);
            let partial=[];
            try{ partial=JSON.parse(fs.readFileSync(dir+"/index.json","utf8")).불완전한월||[]; }catch{}
            const now=new Date();
            const want=[];
            for(let back=1;back<=4;back++){
              const d=new Date(now.getFullYear(),now.getMonth()-back,1);
              const ym=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}`;
              if(!have.has(ym)) want.push(ym);
            }
            // 원본이 그 달 전체를 늦게 채우는 일이 있어, 일수가 모자란 달은 다시 받는다
            for(const ym of partial) if(!want.includes(ym)) want.push(ym);
            console.log("보유 "+have.size+"개월, 불완전 "+partial.length+"개월, 시도 대상: "+(want.join(",")||"(없음)"));
            fs.appendFileSync(process.env.GITHUB_OUTPUT,"months="+want.join(",")+"\n");
          '

      - name: 적재
        if: ${{ steps.plan.outputs.months != '' }}
        # 아직 공개되지 않은 달은 실패하는 것이 정상이므로 종료코드로 잡을 실패가 아니다.
        continue-on-error: true
        run: node scripts/build_livingpop_archive.mjs --months ${{ steps.plan.outputs.months }}

      - name: 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/livingpop
          if git diff --staged --quiet; then
            echo "새로 공개된 달이 없습니다"
          else
            git commit -m "생활인구 아카이브 월간 갱신"
            git push
          fi
